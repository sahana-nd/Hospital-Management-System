# Application Configuration
spring.application.name=Hospital Management System
server.port=8080

# Database Configuration (MySQL Configuration with H2 Fallback)
# MySQL Settings (Uncomment if local MySQL server is running)
# spring.datasource.url=jdbc:mysql://localhost:3306/hospital_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Embedded In-Memory JDBC Database (Works out-of-the-box with auto initialization)
spring.datasource.url=jdbc:h2:mem:hospital_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console Access
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Database Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Logging
logging.level.org.springframework.jdbc=INFO
logging.level.com.hospital.management=DEBUG
